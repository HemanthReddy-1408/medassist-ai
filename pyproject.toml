[project]
name = "medassist"
version = "2.0.0"
description = "A multi-agent clinical question-answering system with a measurement harness for retrieval failure and hallucination."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-dotenv>=1.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4", "mypy>=1.10"]
ui = ["streamlit>=1.33"]

[project.scripts]
medassist = "medassist.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["medassist*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: requires network and a real model provider",
    "slow: takes more than a few seconds",
]
filterwarnings = ["ignore::DeprecationWarning"]
